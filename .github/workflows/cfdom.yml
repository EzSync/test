name: Update CF Domains

on:
  schedule:
    - cron: '0 23 * * *' # 每天 UTC 23:00 运行（对应北京时间每天 7:00）
  workflow_dispatch: # 支持手动运行

jobs:
  update-domains:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run script to fetch and update domains
        run: |
          python - << 'EOF'
          import re
          import requests
          from bs4 import BeautifulSoup

          url = "https://vps789.com/ranking/"
          # 模拟真实主流浏览器的请求头，避免被 Cloudflare 防火墙/WAF 直接拦截
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
              "Referer": "https://vps789.com/",
              "Connection": "keep-alive"
          }

          try:
              response = requests.get(url, headers=headers, timeout=20)
              response.raise_for_status()
          except Exception as e:
              print(f"Error fetching webpage: {e}")
              exit(1)

          soup = BeautifulSoup(response.text, 'html.parser')
          
          # 精准提取页面中属于 CloudFlare 优选 IP 表格的域名 (href 带有 id=11)
          fetched_domains = []
          for a_tag in soup.find_all('a', href=True):
              href = a_tag['href']
              text = a_tag.get_text().strip()
              # 匹配带有 id=11 且符合域名特征的条目
              if 'id=11' in href and '.' in text and ' ' not in text and 'ms' not in text and '%' not in text:
                  if text not in fetched_domains:
                      fetched_domains.append(text)

          print(f"Successfully extracted {len(fetched_domains)} domains.")

          # 读取现有的 cfdoms.txt（如果存在）
          existing_lines = []
          try:
              with open('cfdoms.txt', 'r', encoding='utf-8') as f:
                  for line in f:
                      clean_line = line.strip()
                      if clean_line:
                          existing_lines.append(clean_line)
          except FileNotFoundError:
              pass

          # 规范化新抓取的域名：确保每行只有一个 #CFdom
          new_entries = []
          for domain in fetched_domains:
              base_domain = re.sub(r'\s*#CFdom\s*$', '', domain).strip()
              if base_domain:
                  new_entries.append(f"{base_domain} #CFdom")

          # 规范化已有行
          processed_existing = []
          for line in existing_lines:
              base_domain = re.sub(r'\s*#CFdom\s*$', '', line).strip()
              if base_domain:
                  processed_existing.append(f"{base_domain} #CFdom")

          # 合并并严格按域名去重
          combined = processed_existing + new_entries
          unique_combined = []
          seen_domains = set()
          for item in combined:
              base = item.split()[0]
              if base not in seen_domains:
                  seen_domains.add(base)
                  unique_combined.append(item)

          # 排序
          unique_combined.sort()

          # 保持行数最多 30 个
          final_lines = unique_combined[:30]

          # 写入文件
          with open('cfdoms.txt', 'w', encoding='utf-8') as f:
              for line in final_lines:
                  f.write(line + '\n')

          print(f"Updated cfdoms.txt with {len(final_lines)} lines.")
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add cfdoms.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update cfdoms.txt automatically" && git push)
