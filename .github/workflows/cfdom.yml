name: Update CF Domains

on:
  schedule:
    - cron: '0 23 * * *' # 每天 UTC 23:00 运行（对应北京时间每天 7:00）
  workflow_dispatch: # 支持手动运行

jobs:
  update-domains:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run script to fetch API and update domains
        run: |
          python - << 'EOF'
          import re
          import requests

          api_url = "https://vps789.com/api/ranking/cf"
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
              "Accept": "application/json, text/plain, */*"
          }

          fetched_domains = []
          try:
              response = requests.get(api_url, headers=headers, timeout=15)
              if response.status_code == 200:
                  data = response.json()
                  items = data.get('data', []) or data.get('list', [])
                  for item in items:
                      domain = item.get('domain') or item.get('ip') or item.get('host')
                      if domain:
                          fetched_domains.append(str(domain).strip())
          except Exception as e:
              print(f"API request warning/failed: {e}")

          # 兜底默认列表
          if not fetched_domains:
              print("Falling back to standard domains list...")
              fetched_domains = [
                  "vip.cf.3666888.xyz", "avido.cf.3666888.xyz", "cf1s.cf.3666888.xyz", 
                  "uac.cf.3666888.xyz", "coke.cf.3666888.xyz", "cloudflare-ip.mofashi.ltd", 
                  "cf.cf.3666888.xyz", "www.galgamex.net", "bbs.alipansou.com", 
                  "cfyx.aliyun.20237737.xyz", "yx.cf.090227.xyz", "cfsaas.080112.xyz", 
                  "cdn.7zz.cn", "auto.dolby.dpdns.org", "blog.646474.xyz", 
                  "fw8je9.cf.3666888.xyz", "6.cf.3666888.xyz", "www.mfyx.cn", 
                  "8.cf.3666888.xyz", "cf-ip-node.vov.moe"
              ]

          print(f"Loaded {len(fetched_domains)} domains successfully.")

          # 读取现有的 cfdoms.txt（如果存在）
          existing_lines = []
          try:
              with open('cfdoms.txt', 'r', encoding='utf-8') as f:
                  for line in f:
                      clean_line = line.strip()
                      if clean_line:
                          existing_lines.append(clean_line)
          except FileNotFoundError:
              pass

          # 规范化新抓取的域名：确保域名与 #CFdom 之间没有空格
          new_entries = []
          for domain in fetched_domains:
              # 清除旧的可能存在的标签和空格
              base_domain = re.sub(r'\s*#CFdom\s*$', '', domain).strip()
              if base_domain:
                  new_entries.append(f"{base_domain}#CFdom")

          # 规范化已有行
          processed_existing = []
          for line in existing_lines:
              base_domain = re.sub(r'\s*#CFdom\s*$', '', line).strip()
              if base_domain:
                  processed_existing.append(f"{base_domain}#CFdom")

          # 合并并严格去重
          combined = processed_existing + new_entries
          unique_combined = []
          seen_domains = set()
          for item in combined:
              # 按 # 分割以获取纯域名来进行去重
              base = item.split('#')[0]
              if base not in seen_domains:
                  seen_domains.add(base)
                  unique_combined.append(item)

          # 排序
          unique_combined.sort()

          # 保持行数最多 30 个
          final_lines = unique_combined[:30]

          # 写入文件
          with open('cfdoms.txt', 'w', encoding='utf-8') as f:
              for line in final_lines:
                  f.write(line + '\n')

          print(f"Updated cfdoms.txt with {len(final_lines)} lines.")
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add cfdoms.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update cfdoms.txt format without space" && git push)
