name: Update Wetest Cnames

on:
  schedule:
    - cron: '30 21 * * *' # 北京时间每天 05:30
  workflow_dispatch:

jobs:
  update-cnames:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create update script
        run: |
          cat << 'EOF' > update_cnames.py
          import urllib.request
          import re

          url = "https://www.wetest.vip/page/cloudflare/cname.html"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          
          try:
              with urllib.request.urlopen(req) as resp:
                  html = resp.read().decode("utf-8")
          except Exception as e:
              print(f"Failed to fetch URL: {e}")
              exit(1)

          found = []
          all_tokens = re.findall(r">([^<]+)<", html)
          for token in all_tokens:
              t = token.strip()
              if re.match(r"^(\*\.)?[a-zA-Z0-9][-a-zA-Z0-9]*(\.[a-zA-Z0-9][-a-zA-Z0-9]*)+$", t):
                  found.append(t)
          
          raw_domains = re.findall(r'(?<![wW])[a-zA-Z0-9][-a-zA-Z0-9]*\.(?:com|net|org|cn|cc|xyz|vip|top|me|co|io|us|info|biz|mobi|asia|tel|tv|to|is|la|in|ru|de|uk|ca|au|jp|kr|br|fr|it|es|nl|se|no|fi|dk|pl|cz|hu|ro|gr|pt|ua|ch|at|be|lu|ie|nz|sg|my|th|id|ph|vn|hk|tw)(?:\.[a-zA-Z]{2,})?', html)
          
          processed = set()
          for d in found + list(raw_domains):
              d = d.strip()
              if not d or len(d) < 4 or "." not in d:
                  continue
              # 如果开头是 *. 替换成 abe.
              if d.startswith("*."):
                  d = "abe." + d[2:]
              processed.add(d)

          sorted_domains = sorted(list(processed))
          
          # 写入 wetestcnames.txt，不添加任何后缀，保持纯域名
          with open("wetestcnames.txt", "w", encoding="utf-8") as f:
              for d in sorted_domains:
                  clean_d = d.split("#")[0].strip()
                  f.write(f"{clean_d}\n")
                  
          print(f"Successfully generated wetestcnames.txt with {len(sorted_domains)} domains.")
          EOF

      - name: Run update script
        run: python3 update_cnames.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add wetestcnames.txt
          git status
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update wetestcnames.txt [skip ci]"
            git push
          fi
