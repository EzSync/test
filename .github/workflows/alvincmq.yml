name: Merge CM&Q YAML Nodes from GitLab

on:
  schedule:
    # Runs automatically every day at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:  # Allows manual trigger from the Actions tab

jobs:
  merge-nodes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yq (latest release)
        run: |
          sudo apt-get update && sudo apt-get install -y curl
          curl -L https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          yq --version

      - name: Merge YAML files and deduplicate nodes
        run: |
          # Create temp directory and switch to it
          mkdir -p temp
          cd temp

          # Start with the current alvincmq.yaml (or create an empty one if it doesn't exist)
          cp -n ../alvincmq.yaml alvincmq.yaml || touch alvincmq.yaml

          # List of raw YAML URLs (one per line)
          cat > urls.txt << 'EOF'
          https://gitlab.com/free9999/ipupdate/-/raw/master/backup/img/1/2/ipp/clash.meta2/1/config.yaml
          https://gitlab.com/free9999/ipupdate/-/raw/master/backup/img/1/2/ipp/clash.meta2/2/config.yaml
          https://gitlab.com/free9999/ipupdate/-/raw/master/backup/img/1/2/ipp/clash.meta2/3/config.yaml
          https://gitlab.com/free9999/ipupdate/-/raw/master/backup/img/1/2/ipp/clash.meta2/4/config.yaml
          https://gitlab.com/free9999/ipupdate/-/raw/master/backup/img/1/2/ipp/clash.meta2/5/config.yaml
          https://gitlab.com/free9999/ipupdate/-/raw/master/backup/img/1/2/ipp/clash.meta2/6/config.yaml
          https://gitlab.com/free9999/ipupdate/-/raw/master/backup/img/1/2/ipp/quick/1/config.yaml
          https://gitlab.com/free9999/ipupdate/-/raw/master/backup/img/1/2/ipp/quick/2/config.yaml
          https://gitlab.com/free9999/ipupdate/-/raw/master/backup/img/1/2/ipp/quick/3/config.yaml
          https://gitlab.com/free9999/ipupdate/-/raw/master/backup/img/1/2/ipp/quick/4/config.yaml
          EOF

          # Download and merge each YAML file into temp/alvincmq.yaml
          while IFS= read -r url || [[ -n "$url" ]]; do
            if [[ "$url" =~ ^[[:space:]]*# ]]; then
              continue  # Skip any comment lines
            fi
            echo "Fetching: $url"
            # Download the YAML, strip comments, and append
            curl -s "$url" | yq eval-all 'select(fileIndex == 0) *+ select(fileIndex == 1)' - > tmp.yaml
            cat tmp.yaml >> alvincmq.yaml
            rm tmp.yaml
          done < urls.txt

          # Deduplicate while preserving the original order of first appearance
          yq eval-all '
            . as $item ireduce ({}; .[$item.name] = $item) |
            .[] |
            select(.name != null)
          ' alvincmq.yaml > dedup.yaml

          # Restore the original comment at the top
          echo 'Allvin clash meta files nodes:' > ../alvincmq.yaml
          cat dedup.yaml >> ../alvincmq.yaml

          # Clean up temp files
          cd ..
          rm -rf temp

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alvincmq.yaml
          git commit -m "ci: Merge & deduplicate YAML nodes (automated)" || echo "No changes to commit"
          git push
