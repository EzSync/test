name: Merge Allvin CMQ Nodes

on:
  workflow_dispatch:

  schedule:
    # 03:00 China Standard Time (UTC+8) = 19:00 UTC, previous day
    - cron: "0 19 * * *"

permissions:
  contents: write

jobs:
  merge-nodes:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests

      - name: Download, merge, and remove duplicate nodes
        shell: bash
        run: |
          cat > merge_nodes.py <<'PY'
          import hashlib
          from pathlib import Path

          import requests
          import yaml

          OUTPUT_FILE = Path("alvincmq.yaml")

          # Fixed list of subscription URLs
          SUBSCRIPTION_URLS = [
              "https://gitlab.com/free9999/ipupdate/-/raw/master/backup/img/1/2/ipp/clash.meta2/1/config.yaml",
              "https://gitlab.com/free9999/ipupdate/-/raw/master/backup/img/1/2/ipp/clash.meta2/2/config.yaml",
              "https://gitlab.com/free9999/ipupdate/-/raw/master/backup/img/1/2/ipp/clash.meta2/3/config.yaml",
              "https://gitlab.com/free9999/ipupdate/-/raw/master/backup/img/1/2/ipp/clash.meta2/4/config.yaml",
              "https://gitlab.com/free9999/ipupdate/-/raw/master/backup/img/1/2/ipp/clash.meta2/5/config.yaml",
              "https://gitlab.com/free9999/ipupdate/-/raw/master/backup/img/1/2/ipp/clash.meta2/6/config.yaml",
              "https://gitlab.com/free9999/ipupdate/-/raw/master/backup/img/1/2/ipp/quick/1/config.yaml",
              "https://gitlab.com/free9999/ipupdate/-/raw/master/backup/img/1/2/ipp/quick/2/config.yaml",
              "https://gitlab.com/free9999/ipupdate/-/raw/master/backup/img/1/2/ipp/quick/3/config.yaml",
              "https://gitlab.com/free9999/ipupdate/-/raw/master/backup/img/1/2/ipp/quick/4/config.yaml",
          ]

          session = requests.Session()
          session.headers.update(
              {"User-Agent": "GitHub-Actions-Node-Merger/1.0"}
          )

          unique_proxies = []
          seen_nodes = set()
          failures = []

          for url in SUBSCRIPTION_URLS:
              try:
                  response = session.get(url, timeout=45)
                  response.raise_for_status()

                  parsed = yaml.safe_load(response.text)

                  # Support both:
                  #   { proxies: [ ... ] }
                  #   [ ... ]
                  if isinstance(parsed, dict):
                      proxies = parsed.get("proxies", [])
                  elif isinstance(parsed, list):
                      proxies = parsed
                  else:
                      proxies = []

                  if not isinstance(proxies, list):
                      raise ValueError("The proxies section is not a YAML list")

                  added = 0

                  for proxy in proxies:
                      if not isinstance(proxy, dict):
                          continue

                      # Deduplicate by full normalized node definition.
                      normalized = yaml.safe_dump(
                          proxy,
                          allow_unicode=True,
                          sort_keys=True,
                          default_flow_style=False,
                      )
                      fingerprint = hashlib.sha256(
                          normalized.encode("utf-8")
                      ).hexdigest()

                      if fingerprint not in seen_nodes:
                          seen_nodes.add(fingerprint)
                          unique_proxies.append(proxy)
                          added += 1

                  print(f"Processed {url}: added {added} unique node(s)")

              except Exception as error:
                  failures.append(f"{url} — {error}")
                  print(f"WARNING: Could not process {url}: {error}")

          if not unique_proxies:
              raise RuntimeError(
                  "No valid proxy nodes were collected; output file was not written."
              )

          output = {
              "proxies": unique_proxies
          }

          OUTPUT_FILE.write_text(
              yaml.safe_dump(
                  output,
                  allow_unicode=True,
                  sort_keys=False,
                  default_flow_style=False,
                  width=1000,
              ),
              encoding="utf-8",
          )

          print(f"\nCreated {OUTPUT_FILE} with {len(unique_proxies)} unique node(s).")

          if failures:
              print("\nSources that could not be processed:")
              for failure in failures:
                  print(f"- {failure}")
          PY

          python merge_nodes.py

      - name: Commit updated YAML file
        shell: bash
        run: |
          if git diff --quiet -- alvincmq.yaml; then
            echo "alvincmq.yaml has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add alvincmq.yaml
          git commit -m "chore: update merged CMQ nodes"
          git push
