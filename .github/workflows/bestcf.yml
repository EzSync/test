name: Update BestCF IP List

on:
  schedule:
    - cron: '0 22,10 * * *' # 每天北京时间 6:00 和 18:00 (UTC 22:00 和 10:00)
  workflow_dispatch: # 支持手动触发

jobs:
  update-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process URLs and generate cfbestip.txt
        run: |
          # 1. 下载最新的源文件列表并替换
          curl -s "https://raw.githubusercontent.com/EzSync/test/refs/heads/main/bestcf.txt" > bestcf.txt
          
          # 2. 初始化目标文件
          > cfbestip.txt

          # 3. 循环处理 bestcf.txt 中的每一个 URL
          while IFS= read -r url || [ -n "$url" ]; do
            [ -z "$url" ] && continue
            
            # 获取 URL 内容并处理每一行
            curl -s "$url" | while IFS= read -r line; do
              [ -z "$line" ] && continue
              
              # a. 替换 '|' 为 '-'
              # b. 去掉空格
              # c. 只保留第一个 '-' 之前的内容 (即只保留第一个IP)
              processed=$(echo "$line" | sed 's/|/-/g' | tr -d '[:space:]' | cut -d'-' -f1)
              
              # d. 校验是否包含合法的 IP 地址（支持基础 IPv4 和 IPv6 格式），不包含则跳过
              if echo "$processed" | grep -Eq '([0-9]{1,3}\.){3}[0-9]{1,3}|([0-9a-fA-F:]+:+)+[0-9a-fA-F]+'; then
                echo "$processed" >> cfbestip.txt
              fi
            done
          done < bestcf.txt

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bestcf.txt cfbestip.txt
          # 如果文件有更新，则自动提交
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update cfbestip.txt and filter non-IP lines" && git push)
