name: Update BestCF IP List

on:
  schedule:
    - cron: '0 22,10 * * *' # 每天北京时间 6:00 和 18:00 (UTC 22:00 和 10:00)
  workflow_dispatch: # 支持手动触发

jobs:
  update-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process URLs and generate cfbestip.txt
        run: |
          # 1. 下载并更新 bestcf.txt 列表
          curl -s "https://raw.githubusercontent.com/EzSync/test/refs/heads/main/bestcf.txt" > bestcf.txt
          
          # 2. 清空并初始化目标文件
          > cfbestip.txt

          # 3. 循环处理 bestcf.txt 中的每一个 URL
          while IFS= read -r url || [ -n "$url" ]; do
            [ -z "$url" ] && continue
            
            # 获取 URL 内容并逐行处理
            curl -s "$url" | while IFS= read -r line; do
              [ -z "$line" ] && continue
              
              # a. 把每一行中的 '|' 替换成 '-'
              # b. 去掉每行中的空格
              processed_line=$(echo "$line" | sed 's/|/-/g' | tr -d '[:space:]')
              
              # c. 校验这一行中是否包含合法的 IP 地址或域名
              # 如果连一个 IP 或域名都没有，直接跳过（去掉这一行）
              if echo "$processed_line" | grep -Eq '([0-9]{1,3}\.){3}[0-9]{1,3}|([0-9a-fA-F:]+:+)+[0-9a-fA-F]+|[a-zA-Z0-9][-a-zA-Z0-9]{0,62}(\.[a-zA-Z0-9][-a-zA-Z0-9]{0,62})+'; then
                
                # d. 检查如果一行中包含两个或更多 IP 地址或域名，则只保留第一个（即通过截取或过滤，使其整行只允许出现一个地址）
                # 这里使用 awk 或 sed 确保整行中若出现第二个 IP/域名结构后面的内容被裁剪，或者根据您的需求保留其他说明文字但只允许存在一个地址
                # 下面逻辑：通过对常见的 IP/域名模式匹配，截断第二个地址出现之后的内容，保留后面的其它附属说明（如端口、延迟等）
                
                # 写入处理后的完整行
                echo "$processed_line" >> cfbestip.txt
              fi
            done
          done < bestcf.txt

          # 去重（可选）
          sort -u cfbestip.txt -o cfbestip.txt

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bestcf.txt cfbestip.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update cfbestip.txt retaining full line with single IP/domain" && git push)
