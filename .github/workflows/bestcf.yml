name: Update BestCF IP List

on:
  schedule:
    - cron: '0 22,10 * * *' # 每天北京时间 6:00 和 18:00 (UTC 22:00 和 10:00)
  workflow_dispatch: # 支持手动触发

jobs:
  update-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process URLs and generate cfbestip.txt
        run: |
          # 1. 下载并更新 bestcf.txt 列表
          curl -s "https://raw.githubusercontent.com/EzSync/test/refs/heads/main/bestcf.txt" > bestcf.txt
          
          # 2. 清空并初始化目标文件
          > cfbestip.txt

          # 3. 循环处理 bestcf.txt 中的每一个 URL
          while IFS= read -r url || [ -n "$url" ]; do
            [ -z "$url" ] && continue
            
            # 获取 URL 内容并逐行处理
            curl -s "$url" | while IFS= read -r line; do
              [ -z "$line" ] && continue
              
              # 预处理：去掉空格，并将 '|' 替换为 '-'
              clean_line=$(echo "$line" | tr -d '[:space:]' | sed 's/|/-/g')
              
              # 提取第一个目标（即第一个 '-' 之前的内容）
              first_target=$(echo "$clean_line" | cut -d'-' -f1)
              
              # 正则校验：检查是否为有效的 IP (v4/v6) 或 域名格式
              # 逻辑：含有点号(IP/域名)或冒号(IPv6)的字符串
              if echo "$first_target" | grep -Eq '([0-9]{1,3}\.){3}[0-9]{1,3}|([0-9a-fA-F:]+:+)+[0-9a-fA-F]+|[a-zA-Z0-9][-a-zA-Z0-9]{0,62}(\.[a-zA-Z0-9][-a-zA-Z0-9]{0,62})+'; then
                echo "$first_target" >> cfbestip.txt
              fi
            done
          done < bestcf.txt

          # 去重：可选步骤，确保结果文件中的唯一性
          sort -u cfbestip.txt -o cfbestip.txt

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bestcf.txt cfbestip.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update cfbestip.txt with IP/Domain validation" && git push)
