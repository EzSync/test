name: Update Cloudflare IP Files

on:
  schedule:
    - cron: "0 10,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ip-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and process bestcf.txt
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            "https://raw.githubusercontent.com/EzSync/test/refs/heads/main/bestcf.txt" \
            -o bestcf.source.txt

          awk '
            {
              # 删除每行中的所有空白字符
              gsub(/[[:space:]]/, "", $0)

              # 将 | 替换为 -
              gsub(/\|/, "-", $0)

              # IPv4 地址：只保留每行发现的第一个 IP
              if (match($0, /([0-9]{1,3}\.){3}[0-9]{1,3}/)) {
                ip = substr($0, RSTART, RLENGTH)
                prefix = substr($0, 1, RSTART - 1)
                suffix = substr($0, RSTART + RLENGTH)

                # 删除同一行中的其他 IPv4 地址
                gsub(/([0-9]{1,3}\.){3}[0-9]{1,3}/, "", suffix)

                print prefix ip suffix
              } else {
                print $0
              }
            }
          ' bestcf.source.txt > processed.txt

          # 覆盖两个目标文件
          cp processed.txt bestcf.txt
          cp processed.txt cfbestip.txt

          rm -f bestcf.source.txt processed.txt

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bestcf.txt cfbestip.txt

          if git diff --cached --quiet; then
            echo "文件没有变化。"
            exit 0
          fi

          git commit -m "Update bestcf.txt and cfbestip.txt"
          git push
