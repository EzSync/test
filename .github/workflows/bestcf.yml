name: Update BestCF IP List

on:
  schedule:
    - cron: '0 22,10 * * *' # 每天北京时间 6:00 和 18:00 (UTC 22:00 和 10:00)
  workflow_dispatch: # 支持手动触发

jobs:
  update-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process URLs and generate cfbestip.txt
        run: |
          # 1. 下载并更新 bestcf.txt 列表
          curl -s "https://raw.githubusercontent.com/EzSync/test/refs/heads/main/bestcf.txt" > bestcf.txt
          
          # 2. 清空并初始化目标文件
          > cfbestip.txt

          # 3. 循环处理 bestcf.txt 中的每一个 URL
          while IFS= read -r url || [ -n "$url" ]; do
            [ -z "$url" ] && continue
            
            # 获取 URL 内容并逐行处理
            curl -s "$url" | while IFS= read -r line; do
              [ -z "$line" ] && continue
              
              # a. 把每一行中的 '|' 替换成 '-'
              # b. 去掉每行中的空格
              processed_line=$(echo "$line" | sed 's/|/-/g' | tr -d '[:space:]')
              
              # c. 核心去重与截断处理：
              # 如果一行中由于拼接导致后面重复出现了相同的 IP/域名，利用 awk 提取第一个出现的 IP/域名，
              # 并把从“第二个相同 IP/域名”或其连接符开始后面多余的重复部分切掉，只保留第一次出现的地址和中间的说明（如 #地区...）
              cleaned_line=$(echo "$processed_line" | awk '
                # 匹配 IPv4 或 域名 (含可选端口) 的正则
                match($0, /[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}(:[0-9]+)?|[a-zA-Z0-9][-a-zA-Z0-9]{0,62}(\.[a-zA-Z0-9][-a-zA-Z0-9]{0,62})+(:[0-9]+)?/) {
                  # 找到第一个地址
                  ip1 = substr($0, RSTART, RLENGTH)
                  
                  # 查找第一个地址在字符串中第一次出现的位置
                  pos1 = RSTART
                  
                  # 在第一个地址之后，查找有没有第二次出现相同的地址
                  rest = substr($0, pos1 + RLENGTH)
                  if (index(rest, ip1) > 0) {
                    # 如果后面重复出现了，就只截取到第二次出现之前的内容（或者去掉重复拼接部分）
                    # 这里精确切掉从第二个 ip1 开始及之后的内容，只保留中间的备注（如 #地区...）
                    # 重新组合：前半部分 + 中间说明（去掉结尾重复的 -ip1）
                    sub("-"ip1".*", "", $0)
                  }
                  print $0
                }
              ')
              
              # 如果处理后不为空，则写入文件
              if [ -n "$cleaned_line" ]; then
                echo "$cleaned_line" >> cfbestip.txt
              fi
            done
          done < bestcf.txt

          # 去重
          sort -u cfbestip.txt -o cfbestip.txt

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bestcf.txt cfbestip.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update cfbestip.txt and remove trailing duplicate IP/domain" && git push)
