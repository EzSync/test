name: Update UOUIN.txt

on:
  schedule:
    # GitHub Actions 使用 UTC：
    # 02:00 UTC = 中国标准时间 10:00
    # 14:00 UTC = 中国标准时间 22:00
    - cron: "0 2 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-uouin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and process source
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL "https://090227.pages.dev/bestcf?isp=all&ips=20" \
            | awk '
              {
                # 删除当前行中的所有空白字符
                gsub(/[[:space:]]/, "", $0)

                # 查找第一个 |
                first = index($0, "|")
                if (first == 0) {
                  next
                }

                # 在第一个 | 后面查找第二个 |
                rest = substr($0, first + 1)
                second = index(rest, "|")
                if (second == 0) {
                  next
                }

                # 截取第二个 | 之前的内容，
                # 并将第一个 | 替换成 -
                print substr($0, 1, first - 1) "-" substr(rest, 1, second - 1)
              }
            ' > UOUIN.txt

      - name: Commit and push UOUIN.txt
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add UOUIN.txt

          if git diff --cached --quiet; then
            echo "UOUIN.txt 没有变化。"
            exit 0
          fi

          git commit -m "Update UOUIN.txt"
          git push
