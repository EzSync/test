name: Update UOUIN.txt

on:
  schedule:
    - cron: "0 8,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-uouin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and process source
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL "https://090227.pages.dev/bestcf?isp=all&ips=20" \
            | awk '
              {
                # 删除当前行中的所有空白字符
                gsub(/[[:space:]]/, "", $0)

                # 截取第一个 | 之前的内容
                first = index($0, "|")

                if (first > 0) {
                  print substr($0, 1, first - 1)
                } else {
                  print $0
                }
              }
            ' > UOUIN.txt

      - name: Commit and push UOUIN.txt
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add UOUIN.txt

          if git diff --cached --quiet; then
            echo "UOUIN.txt 没有变化。"
            exit 0
          fi

          git commit -m "Update UOUIN.txt"
          git push
