name: Update UOUIN List

on:
  schedule:
    - cron: '0 10,22 * * *' # 每天北京时间 6:00 和 18:00 运行 (UTC 22:00 和 10:00)
  workflow_dispatch: # 支持手动触发

jobs:
  update-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate and process UOUIN.txt
        run: |
          # 每次运行前清空或初始化 UOUIN.txt
          > UOUIN.txt

          # 1 & 2 & 3. 下载内容、去掉空格、去掉第一个 '|' 及之后的部分，并写入文件
          curl -s "https://090227.pages.dev/bestcf?isp=all&ips=20" | while IFS= read -r line; do
            # 去掉行内所有空格
            line=$(echo "$line" | tr -d '[:space:]')
            
            # 如果行为空则跳过
            [ -z "$line" ] && continue

            # 去掉第一个 '|' 及之后的部分（保留第一个 '|' 左边的内容）
            processed_line=$(echo "$line" | cut -d'|' -f1)

            # 写入 UOUIN.txt
            echo "$processed_line" >> UOUIN.txt
          done

      - name: Commit and push if changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add UOUIN.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update UOUIN.txt" && git push)
