name: Update VPS789 Domains

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  update-domains:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Script to Fetch and Save Domains
        run: |
          python3 -c '
          import re
          import urllib.request
          import json

          # 使用稳定的代理/渲染通道抓取动态网页内容
          target_url = "https://vps789.com/cfip/"
          api_url = f"https://r.jina.ai/{target_url}"
          
          req = urllib.request.Request(
              api_url,
              headers={
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
                  "Accept": "application/json"
              }
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  result = json.loads(response.read().decode("utf-8"))
                  content = result.get("data", {}).get("content", "")
              
              # 匹配所有可能的域名
              candidates = re.findall(r"\b([a-zA-Z0-9][-a-zA-Z0-9]{0,62}(?:\.[a-zA-Z0-9][-a-zA-Z0-9]{0,62})+)\b", content)
              
              # 严格清洗规则：
              # 1. 必须包含小数点
              # 2. 排除常见干扰词（如vps789自身、jina等）
              # 3. 排除纯数字组合、带有单位（如MB、ms）或不符合标准域名的杂质
              exclude_words = {"vps789.com", "jina.ai", "github.com", "githubusercontent.com", "cloudflare.com"}
              
              clean_domains = set()
              for d in candidates:
                  d_lower = d.lower()
                  if d_lower in exclude_words:
                      continue
                  if "." in d and not d.replace(".", "").isdigit():
                      # 必须符合标准的域名结构
                      if re.match(r"^[a-zA-Z0-9][-a-zA-Z0-9]{0,62}(\.[a-zA-Z0-9][-a-zA-Z0-9]{0,62})+$", d):
                          clean_domains.add(d)

              sorted_domains = sorted(list(clean_domains))
              
              if not sorted_domains:
                  print("警告：未成功解析出任何有效域名！")
                  exit(1)

              with open("vps789doms.txt", "w", encoding="utf-8") as f:
                  for domain in sorted_domains:
                      f.write(domain + "\n")
              print(f"成功获取并写入了 {len(sorted_domains)} 个纯净域名。")
          except Exception as e:
              print(f"获取失败: {e}")
              exit(1)
          '

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add vps789doms.txt
          if git diff --staged --quiet; then
            echo "域名无变化，无需提交"
          else
            git commit -m "Update vps789doms.txt (Clean domains)"
            git push
          fi
