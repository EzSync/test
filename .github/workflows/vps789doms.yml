name: Update VPS789 Domains

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  update-domains:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Script to Fetch and Save Domains
        run: |
          python3 -c '
          import re
          import urllib.request
          import json

          # 使用稳定的免费网页解析代理或直接解析公开内容
          target_url = "https://vps789.com/cfip/"
          # 通过自带 API 或稳定的通用抓取方式
          api_url = f"https://r.jina.ai/{target_url}"
          
          req = urllib.request.Request(
              api_url,
              headers={
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
                  "Accept": "application/json"
              }
          )

          try:
              with urllib.request.urlopen(req, timeout=25) as response:
                  result = json.loads(response.read().decode("utf-8"))
                  content = result.get("data", {}).get("content", "")
              
              # 在返回的文本内容中通过正则精准匹配优选域名
              candidates = re.findall(r"\b([a-zA-Z0-9][-a-zA-Z0-9]{0,62}(?:\.[a-zA-Z0-9][-a-zA-Z0-9]{0,62})+)\b", content)
              
              # 过滤掉一些常见的公共后缀或非目标域名，保留真正需要的 CNAME 域名
              exclude_words = {"vps789.com", "github.com", "githubusercontent.com", "cloudflare.com"}
              domains = sorted(list(set([d for d in candidates if d.lower() not in exclude_words and "." in d])))
              
              with open("vps789doms.txt", "w", encoding="utf-8") as f:
                  for domain in domains:
                      f.write(domain + "\n")
              print(f"成功获取并写入了 {len(domains)} 个域名。")
          except Exception as e:
              print(f"获取失败: {e}")
              exit(1)
          '

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add vps789doms.txt
          if git diff --staged --quiet; then
            echo "域名无变化，无需提交"
          else
            git commit -m "Update vps789doms.txt"
            git push
          fi
