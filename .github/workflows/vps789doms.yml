name: Update VPS789 Domains

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  update-domains:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Script to Fetch and Save Domains
        run: |
          python3 -c '
          import re
          import urllib.request
          from html.parser import HTMLParser

          class VPS789Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_table = False
                  self.in_row = False
                  self.cell_index = 0
                  self.in_first_cell = False
                  self.cell_data = []
                  self.domains = set()

              def handle_starttag(self, tag, attrs):
                  if tag == "table":
                      self.in_table = True
                  elif self.in_table and tag == "tr":
                      self.in_row = True
                      self.cell_index = 0
                  elif self.in_row and tag == "td":
                      if self.cell_index == 0:
                          self.in_first_cell = True
                      self.cell_index += 1

              def handle_endtag(self, tag):
                  if tag == "table":
                      self.in_table = False
                  elif tag == "tr":
                      self.in_row = False
                  elif tag == "td":
                      if self.in_first_cell:
                          self.in_first_cell = False
                          text = "".join(self.cell_data).strip()
                          self.cell_data = []
                          # 严格校验是否为标准的纯净域名
                          if "." in text and " " not in text and not text.endswith("MB") and not text.replace(".", "").isdigit():
                              if re.match(r"^[a-zA-Z0-9][-a-zA-Z0-9]{0,62}(\.[a-zA-Z0-9][-a-zA-Z0-9]{0,62})+$", text):
                                  self.domains.add(text)

              def handle_data(self, data):
                  if self.in_first_cell:
                      self.cell_data.append(data)

          target_url = "https://vps789.com/cfip/"
          req = urllib.request.Request(
              target_url,
              headers={
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
              }
          )

          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  html_content = response.read().decode("utf-8")
              
              parser = VPS789Parser()
              parser.feed(html_content)
              
              sorted_domains = sorted(list(parser.domains))
              
              if not sorted_domains:
                  print("警告：未抓取到任何域名！")
                  exit(1)

              with open("vps789doms.txt", "w", encoding="utf-8") as f:
                  for domain in sorted_domains:
                      f.write(domain + "\n")
              print(f"成功获取并写入了 {len(sorted_domains)} 个纯净域名。")
          except Exception as e:
              print(f"获取失败: {e}")
              exit(1)
          '

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add vps789doms.txt
          if git diff --staged --quiet; then
            echo "域名无变化，无需提交"
          else
            git commit -m "Update vps789doms.txt (Clean domains)"
            git push
          fi
