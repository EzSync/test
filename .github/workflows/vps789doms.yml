name: Update VPS789 Domains

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  update-domains:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Script to Fetch and Save Domains
        run: |
          python3 -c '
          import re
          import urllib.request

          url = "https://vps789.com/cfip/"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
          )

          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  html_content = response.read().decode("utf-8")
              
              # 用正则提取所有表格单元格里的文本，并过滤出符合域名规则的纯净文本
              # 匹配形如 xxx.xx 或者 xxx.xxx.xx 的域名
              candidates = re.findall(r">([a-zA-Z0-9][-a-zA-Z0-9]{0,62}(?:\.[a-zA-Z0-9][-a-zA-Z0-9]{0,62})+)<", html_content)
              
              domains = sorted(list(set(candidates)))
              
              with open("vps789doms.txt", "w", encoding="utf-8") as f:
                  for domain in domains:
                      f.write(domain + "\n")
              print(f"成功获取并写入了 {len(domains)} 个域名。")
          except Exception as e:
              print(f"获取失败: {e}")
              exit(1)
          '

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add vps789doms.txt
          if git diff --staged --quiet; then
            echo "域名无变化，无需提交"
          else
            git commit -m "Update vps789doms.txt"
            git push
          fi
