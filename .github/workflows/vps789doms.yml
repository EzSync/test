name: Update VPS789 CF CNAME Domains

on:
  schedule:
    - cron: '0 22 * * *' # 每天 UTC 22:00 运行（对应北京时间每天 6:00）
  workflow_dispatch: # 支持手动运行

jobs:
  update-vps789-cname:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run script to fetch and replace CNAME domains
        run: |
          python - << 'EOF'
          import re
          import requests
          from bs4 import BeautifulSoup

          # 尝试优先访问可能的 CNAME 接口，若无则抓取页面
          api_urls = [
              "https://vps789.com/api/cfip/cname",  # 常见的后端数据接口
              "https://vps789.com/cfip"
          ]
          
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
              "Accept": "application/json, text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "zh-CN,zh;q=0.9,en;q=0.8",
              "Connection": "keep-alive"
          }

          fetched_domains = []

          for url in api_urls:
              try:
                  response = requests.get(url, headers=headers, timeout=20)
                  if response.status_code == 200:
                      # 检查是否为 JSON 响应
                      if 'application/json' in response.headers.get('Content-Type', ''):
                          data = response.json()
                          items = data.get('data', []) or data.get('list', []) or data.get('rows', [])
                          for item in items:
                              if isinstance(item, dict):
                                  domain = item.get('domain') or item.get('cname') or item.get('host') or item.get('ip')
                                  if domain:
                                      fetched_domains.append(str(domain).strip())
                              elif isinstance(item, str):
                                  fetched_domains.append(item.strip())
                      else:
                          # HTML 页面解析
                          soup = BeautifulSoup(response.text, 'html.parser')
                          # 提取所有符合域名特征的文本
                          for tag in soup.find_all(['a', 'td', 'span', 'code', 'div']):
                              text = tag.get_text().strip()
                              # 简单的域名规则（包含点、无空格、无中文、无协议头）
                              if '.' in text and ' ' not in text and 'ms' not in text and '%' not in text and not text.startswith('http'):
                                  if len(text) > 3 and text not in fetched_domains:
                                      fetched_domains.append(text)
                          
                          # 辅助正则匹配网页源码中可能的 CNAME 域名
                          pattern = r'\b(?:[a-zA-Z0-9][-a-zA-Z0-9]*\.)+[a-zA-Z]{2,}\b'
                          matches = re.findall(pattern, response.text)
                          for m in matches:
                              if m not in fetched_domains and 'vps789.com' not in m and 'cloudflare' not in m and 'google' not in m and 'bootstrap' not in m:
                                  fetched_domains.append(m)
                                  
                      if len(fetched_domains) > 10:  # 如果成功获取到大量数据，跳出循环
                          break
              except Exception as e:
                  print(f"Error trying {url}: {e}")

          # 如果抓取失败的兜底清单（确保即使网络受阻也有基础数据）
          if not fetched_domains:
              print("Using robust fallback CNAME list...")
              fetched_domains = [
                  "vip.cf.3666888.xyz", "avido.cf.3666888.xyz", "cf1s.cf.3666888.xyz", 
                  "uac.cf.3666888.xyz", "coke.cf.3666888.xyz", "cloudflare-ip.mofashi.ltd", 
                  "cf.cf.3666888.xyz", "www.galgamex.net", "bbs.alipansou.com", 
                  "cfyx.aliyun.20237737.xyz", "yx.cf.090227.xyz", "cfsaas.080112.xyz", 
                  "cdn.7zz.cn", "auto.dolby.dpdns.org", "blog.646474.xyz", 
                  "fw8je9.cf.3666888.xyz", "6.cf.3666888.xyz", "www.mfyx.cn", 
                  "8.cf.3666888.xyz", "cf-ip-node.vov.moe"
              ]

          print(f"Total raw domains captured: {len(fetched_domains)}")

          # 数据规范化：清理旧后缀、去重
          unique_domains = set()
          for domain in fetched_domains:
              # 移除可能存在的已有后缀和空格
              base_domain = re.sub(r'#.*$', '', domain).strip()
              if base_domain and '.' in base_domain:
                  unique_domains.add(base_domain)

          # 按字母顺序排序
          sorted_domains = sorted(list(unique_domains))

          # 格式化每行（行尾直接连接 #VPS789，无空格）
          final_lines = [f"{domain}#VPS789" for domain in sorted_domains]

          # 完全替换写入 vps789doms.txt
          with open('vps789doms.txt', 'w', encoding='utf-8') as f:
              for line in final_lines:
                  f.write(line + '\n')

          print(f"Successfully wrote {len(final_lines)} domains to vps789doms.txt (Replaced old data).")
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add vps789doms.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update vps789doms.txt with CNAME domains" && git push)
