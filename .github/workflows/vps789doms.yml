name: Update VPS789 Domains

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  update-domains:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Script to Fetch and Save Domains
        run: |
          python3 -c '
          import re
          import requests

          # 尝试通过其后端接口或通用 API 获取原始数据
          api_urls = [
              "https://vps789.com/api/cfip",  # 假设的常见 API 路径
              "https://vps789.com/cfip/data"
          ]
          
          # 如果直接请求主页面，可以通过更换请求头或查找其数据源地址解决
          # 另外一种稳定方式：通过官方备用接口或直接解析
          url = "https://vps789.com/cfip/"
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
              "Referer": "https://vps789.com/cfip/",
              "Accept": "application/json, text/javascript, */*; q=0.01",
              "X-Requested-With": "XMLHttpRequest"
          }

          try:
              # 先尝试模拟 Ajax 异步请求
              response = requests.get("https://vps789.com/cfip/list", headers=headers, timeout=15)
              if response.status_code != 200:
                  # 如果没有专属数据接口，改用通用抓取并带上完整浏览器头
                  response = requests.get(url, headers=headers, timeout=15)
              
              response.raise_for_status()
              text_content = response.text
              
              # 正则提取所有符合规范的优选 CNAME 域名
              candidates = re.findall(r"\b([a-zA-Z0-9][-a-zA-Z0-9]{0,62}(?:\.[a-zA-Z0-9][-a-zA-Z0-9]{0,62})+)\b", text_content)
              
              # 清洗过滤杂质
              exclude_words = {"vps789.com", "github.com", "cloudflare.com", "google.com", "telegram.org"}
              domains = set()
              for d in candidates:
                  d_lower = d.lower()
                  if d_lower in exclude_words:
                      continue
                  if "." in d and not d.replace(".", "").isdigit() and not d.endswith("MB"):
                      if re.match(r"^[a-zA-Z0-9][-a-zA-Z0-9]{0,62}(\.[a-zA-Z0-9][-a-zA-Z0-9]{0,62})+$", d):
                          domains.add(d)

              sorted_domains = sorted(list(domains))
              
              if not sorted_domains:
                  print("警告：未解析到有效域名。")
                  exit(1)

              with open("vps789doms.txt", "w", encoding="utf-8") as f:
                  for domain in sorted_domains:
                      f.write(domain + "\n")
              print(f"成功获取并写入了 {len(sorted_domains)} 个纯净域名。")
          except Exception as e:
              print(f"获取失败: {e}")
              exit(1)
          '

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add vps789doms.txt
          if git diff --staged --quiet; then
            echo "域名无变化，无需提交"
          else
            git commit -m "Update vps789doms.txt (API fetch)"
            git push
          fi
