name: Update VPS789 Domains

on:
  schedule:
    # 每天北京时间 6:00 运行 (UTC时间 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  update-domains:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Fetch and Parse Domains
        run: |
          python3 -c '
          import re
          import requests
          from bs4 import BeautifulSoup

          url = "https://vps789.com/cfip/"
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }

          try:
              response = requests.get(url, headers=headers, timeout=20)
              response.raise_for_status()
              
              soup = BeautifulSoup(response.text, "html.parser")
              domains = set()
              
              # 遍历页面表格中的每一行，提取第一列（CF优选IP / CNAME 域名）
              for tr in soup.find_all("tr"):
                  tds = tr.find_all("td")
                  if len(tds) > 0:
                      text = tds[0].get_text(strip=True)
                      # 严格清洗：排除带有延迟、纯数字、MB/s单位等杂质，仅保留合法域名
                      if "." in text and " " not in text and not text.endswith("MB") and not text.replace(".", "").isdigit():
                          if re.match(r"^[a-zA-Z0-9][-a-zA-Z0-9]{0,62}(\.[a-zA-Z0-9][-a-zA-Z0-9]{0,62})+$", text):
                              domains.add(text)
                              
              sorted_domains = sorted(list(domains))
              
              if not sorted_domains:
                  print("错误：未匹配到任何有效域名！")
                  exit(1)

              with open("vps789doms.txt", "w", encoding="utf-8") as f:
                  for domain in sorted_domains:
                      f.write(domain + "\n")
              print(f"成功获取并写入了 {len(sorted_domains)} 个纯净域名到 vps789doms.txt。")
          except Exception as e:
              print(f"获取失败: {e}")
              exit(1)
          '

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add vps789doms.txt
          if git diff --staged --quiet; then
            echo "域名无变化，无需提交"
          else
            git commit -m "Update vps789doms.txt (Automated)"
            git push
          fi
